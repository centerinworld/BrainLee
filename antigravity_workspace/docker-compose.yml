version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: antigravity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antigravity_db
      POSTGRES_USER: antigravity_user
      POSTGRES_PASSWORD: antigravity_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./memory/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antigravity_user -d antigravity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: antigravity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: antigravity_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
