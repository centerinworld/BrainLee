name: 해외 뉴스 자동 수집 (Overseas News Sync)

on:
  schedule:
    # 매일 01:00, 07:00, 13:00, 19:00 UTC (한국 10시, 16시, 22시, 04시)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      feed_type:
        description: '수집 대상 피드 (company / competitor / both)'
        required: false
        default: 'both'

jobs:
  sync-news:
    name: RSS 해외 뉴스 수집
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          pip install feedparser requests python-dateutil

      - name: 해외 뉴스 RSS 수집
        id: collect
        env:
          NEWSINFO_API_URL: ${{ secrets.NEWSINFO_API_URL || 'https://api.newsinfo.cloud' }}
          NEWSINFO_API_TOKEN: ${{ secrets.NEWSINFO_API_TOKEN }}
          FEED_TYPE: ${{ github.event.inputs.feed_type || 'both' }}
        run: |
          python3 scripts/collect_overseas_news.py

      - name: 수집 결과 저장 (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: overseas-news-${{ github.run_number }}
          path: data/overseas-news-latest.json
          retention-days: 7

      - name: 수집 현황 요약
        run: |
          echo "### 해외 뉴스 수집 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/overseas-news-latest.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('data/overseas-news-latest.json')); print(len(d.get('items', [])))" 2>/dev/null || echo "0")
            echo "- **수집 건수**: ${COUNT}건" >> $GITHUB_STEP_SUMMARY
            echo "- **실행 시각**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
            echo "- **피드 타입**: ${FEED_TYPE}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 수집 결과 파일 없음 (수집 실패 또는 새 항목 없음)" >> $GITHUB_STEP_SUMMARY
          fi
