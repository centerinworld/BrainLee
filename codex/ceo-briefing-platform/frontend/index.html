<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Key Indicator — 주요 경제지표 · 뉴스정보</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./keyindicator.css?v=20260929">
  <script src="/hubbar.js?v=20260927" defer></script>
</head>
<body>
  <main class="ki">
    <header class="ki-head">
      <div>
        <h1>Key Indicator</h1>
        <p>주요 경제지표와 뉴스를 한눈에 — 누구나 볼 수 있는 공개 화면입니다.</p>
      </div>
    </header>

    <div class="ki-tabs" role="tablist">
      <button role="tab" id="tab-eco" class="on" data-tab="eco">주요 경제지표</button>
      <button role="tab" id="tab-news" data-tab="news">뉴스정보</button>
      <a href="/kai/" class="ki-tab-agi" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:700;color:#1a73e8;text-decoration:none;border-left:1px solid var(--line-strong,#dadce0);white-space:nowrap;">
        🛰️ 시장분석 · AI 인텔리전스 <span style="font-size:11px;opacity:0.7;">↗</span>
      </a>
    </div>

    <section id="pane-eco">
      <div class="ki-card">
        <div class="ki-row"><h2>국내 주요 지표</h2><span class="ki-muted" id="kr-meta"></span></div>
        <div class="ki-table-wrap"><table class="ki-table" id="kr-table"><thead><tr><th>지표</th><th>구분</th><th>기준월</th><th class="num">현재값</th><th class="num">이전값</th><th class="num">증감</th><th class="num">증감률</th><th>출처</th></tr></thead><tbody><tr><td colspan="8" class="ki-muted">불러오는 중…</td></tr></tbody></table></div>
      </div>
      <div class="ki-card">
        <div class="ki-row"><h2>글로벌 주요 지표</h2><input id="gl-q" class="ki-search" placeholder="지표·국가 검색 (예: 금리, US, 환율)"></div>
        <div class="ki-chips" id="gl-cats"></div>
        <div class="ki-table-wrap ki-tall"><table class="ki-table" id="gl-table"><thead><tr><th>지표</th><th>구분</th><th>단위</th><th>기준일</th><th class="num">값</th><th class="num">직전</th><th class="num">변화</th><th>출처</th></tr></thead><tbody><tr><td colspan="8" class="ki-muted">불러오는 중…</td></tr></tbody></table></div>
        <p class="ki-muted ki-foot" id="gl-meta"></p>
      </div>
    </section>

    <section id="pane-news" hidden>
      <div class="ki-card">
        <div class="ki-row"><h2>뉴스정보</h2><input id="news-q" class="ki-search" placeholder="제목·요약·언론사 검색"></div>
        <p class="ki-muted" id="news-meta"></p>
        <ul class="ki-news" id="news-list"><li class="ki-muted">불러오는 중…</li></ul>
      </div>
    </section>
  </main>

  <!-- 지표 상세(이력) 모달 — 행 클릭 시 표시. 2026-09-29: 공개 화면에서 상세 내역이 안 보인다는 지적으로 복원. -->
  <div class="ki-modal-backdrop" id="ki-modal" hidden>
    <div class="ki-modal" role="dialog" aria-modal="true">
      <div class="ki-modal-head">
        <h3 id="ki-modal-title">지표 상세</h3>
        <button id="ki-modal-close" class="ki-modal-x" aria-label="닫기">✕</button>
      </div>
      <p class="ki-muted" id="ki-modal-meta"></p>
      <div class="ki-modal-chart" id="ki-modal-chart"></div>
      <div class="ki-table-wrap ki-tall">
        <table class="ki-table" id="ki-modal-table">
          <thead><tr><th>날짜</th><th class="num">값</th><th class="num">증감</th><th class="num">증감률</th></tr></thead>
          <tbody><tr><td colspan="4" class="ki-muted">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./keyindicator.js?v=20260929"></script>
</body>
</html>
