<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>승인형 AI 코드 작업</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f3f5f9;color:#17233a;margin:0}main{max-width:980px;margin:32px auto;padding:24px}section,article{background:white;border:1px solid #d7deea;border-radius:12px;padding:24px;margin:18px 0}h1{font-size:28px}label{display:block;margin-top:12px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #acb9cf;border-radius:6px;box-sizing:border-box}input,textarea{width:100%}button{background:#2347a8;color:white;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f9;padding:16px;font-size:13px;max-height:540px;overflow:auto}.error{color:#a62222}.muted{color:#5a6c82}details{margin:12px 0}</style>
<main><h1>승인형 AI 코드 작업</h1><p>작업과 파일 범위를 확인해 승인하면 AI가 코드를 작성하고 독립 복사본에서 테스트합니다. 결과를 검토한 뒤 원본 적용을 별도로 승인합니다.</p>
<section id="login"><h2>관리자 로그인</h2><form id="loginForm"><label>계정<input id="username" autocomplete="username" required></label><label>PIN<input id="pin" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section>
<section><h2>코드 작업 요청</h2><form id="createForm"><label>모델<select id="provider"><option value="claude">Claude</option><option value="codex">Codex</option><option value="gemini">Gemini</option><option value="qwen">Qwen</option><option value="deepseek">DeepSeek</option></select></label><label>수정할 내용<textarea id="instruction" rows="4" required placeholder="고칠 문제와 기대 동작을 적으세요."></textarea></label><label>수정 허용 파일 — 저장소 기준 경로, 한 줄에 하나<textarea id="paths" rows="3" required placeholder="codex/ceo-briefing-platform/backend/example.py"></textarea></label><label>실행할 unittest 모듈<input id="testModule" required placeholder="tests.test_example"></label><p class="muted">기준은 저장소의 커밋된 HEAD입니다. 미커밋 파일은 포함되지 않습니다. 선택한 파일 내용이 선택한 모델에 전달됩니다. 현재 범위: 텍스트 파일 최대 20개, 입력 48KB, 변경 256KB, 테스트 60초·네트워크 차단. API 인증·사용량 제한은 그대로 적용됩니다.</p><button>승인 요청 만들기</button></form></section>
<p id="notice" role="status"></p><button id="refresh">목록 새로고침</button><div id="jobs"></div></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('agiSessionToken')||'';
const labels={AWAITING_APPROVAL:'실행 승인 대기',APPROVED:'승인됨 · 실행 대기',RUNNING:'AI 수정·테스트 중',READY_FOR_REVIEW:'테스트 통과 · 변경 검토',TEST_FAILED:'테스트 실패',FAILED:'실행 실패',REJECTED:'거부됨',APPLYING:'원본 적용 중',APPLY_FAILED:'원본 적용 실패',APPLIED_TO_WORKSPACE:'원본 파일 적용됨 · 서비스 배포 별도',ROLLED_BACK:'원본 적용 되돌림'};
function notice(t,error=false){$('notice').textContent=t;$('notice').className=error?'error':''}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){if(r.status===401){token='';sessionStorage.removeItem('agiSessionToken');$('login').hidden=false;}throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));}return j;}
$('login').hidden=!!token;
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await api('/app-login','POST',{username:$('username').value,pin:$('pin').value});if(j.role!=='admin')throw Error('관리자 계정이 필요합니다.');token=j.token;sessionStorage.setItem('agiSessionToken',token);$('pin').value='';$('login').hidden=true;await refresh();}catch(e){notice(e.message,true)}};
$('createForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('/api/agi/code-jobs','POST',{instruction:$('instruction').value,provider:$('provider').value,paths:$('paths').value.split('\n').map(x=>x.trim()).filter(Boolean),test_module:$('testModule').value.trim()});notice('요청을 만들었습니다. 아래에서 범위를 확인하고 실행을 승인하세요.');await refresh();}catch(e){notice(e.message,true)}finally{b.disabled=false}};
function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n;}
function action(parent,label,job,verb,fingerprint){const b=el('button',label,parent);b.onclick=async()=>{b.disabled=true;try{await api('/api/agi/code-jobs/'+job.id+'/'+verb,'POST',{fingerprint});notice(label+' 요청이 반영되었습니다.');await refresh();}catch(e){notice(e.message,true);b.disabled=false;}};}
async function refresh(){if(!token)return;try{const jobs=await api('/api/agi/code-jobs');$('jobs').replaceChildren();for(const j of jobs){const a=el('article','',$('jobs'));el('h2',(labels[j.status]||j.status)+' · '+j.spec.provider,a);el('p',j.spec.instruction,a);el('p','허용 파일: '+j.spec.paths.join(', ')+' / 테스트: '+j.spec.test_module,a);el('p','기준 커밋: '+j.spec.base_sha,a);if(j.error)el('pre',j.error,a);if(j.status==='AWAITING_APPROVAL'){el('p','승인 유효기간: '+new Date(j.approval_expires_at*1000).toLocaleString(),a);action(a,'이 범위의 AI 수정·테스트 실행 승인',j,'approve',j.approval_hash);action(a,'거부',j,'reject',j.approval_hash);}if(j.diff){const d=el('details','',a);el('summary','전체 변경 보기',d);el('pre',j.diff,d);el('p','변경 지문: '+j.diff_hash,a);}if(j.tests){el('pre','테스트 종료 코드: '+j.tests.exit_code+'\n'+j.tests.stdout+'\n'+j.tests.stderr,a);}if(j.status==='READY_FOR_REVIEW')action(a,'검토한 변경을 원본 파일에 적용 승인',j,'apply',j.diff_hash);if(j.status==='APPLIED_TO_WORKSPACE')action(a,'이 변경 되돌리기 승인',j,'rollback',j.diff_hash);}}catch(e){notice(e.message,true)}}
$('refresh').onclick=refresh;refresh();setInterval(refresh,10000);
</script></html>
