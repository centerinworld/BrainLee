<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KAI News Center</title>
  <link rel="stylesheet" href="./styles.css?v=20260628">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="top-header">
      <div class="header-inner">
        <div class="logo-area">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <rect width="28" height="28" rx="6" fill="#1a73e8"/>
              <path d="M14 6L14 22M6 14L22 14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="14" cy="14" r="4" stroke="white" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="logo-text">
            <h1>KAI News Center</h1>
            <span class="logo-sub">실시간 경제 인텔리전스</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="btn-icon" title="새로고침">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C12.5 3 14.7 4.3 16 6.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M13 6H16.5V2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span id="lastUpdated" class="last-updated">업데이트 중...</span>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" id="navTabs">
      <button class="tab active" data-tab="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.2"/>
        </svg>
        <span>대시보드</span>
      </button>
      <button class="tab" data-tab="exchange">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M5 6.5H11M5 9.5H11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M8 4V12" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span>환율</span>
      </button>
      <button class="tab" data-tab="interest">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 14L4 10L7 11L9 7L12 8L14 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="2" cy="14" r="1.5" fill="currentColor" fill-opacity="0.3"/>
        </svg>
        <span>금리</span>
      </button>
      <button class="tab" data-tab="stock">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="9" width="4" height="6" rx="0.8" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1"/>
          <rect x="6" y="5" width="4" height="10" rx="0.8" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1"/>
          <rect x="11" y="1" width="4" height="14" rx="0.8" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1"/>
        </svg>
        <span>주식</span>
      </button>
      <button class="tab" data-tab="economy">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 14H14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M4 12V8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M7 12V6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M10 12V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M13 12V2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span>경제</span>
      </button>
      <button class="tab" data-tab="news">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4H14M2 8H10M2 12H12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="13" cy="12" r="2" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span>뉴스</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>경제 데이터를 불러오는 중...</p>
      </div>
    </main>
  </div>

  <script src="./app.js?v=20260628"></script>
</body>
</html>
